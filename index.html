<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong mode.
      // The stored value is the mode ('system' | 'dark' | 'light'); resolve
      // 'system' (or an absent value) through the OS preference.
      try {
        var t = localStorage.getItem('forge.theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta
      name="description"
      content="Forge — a calm, precise workspace for serious markets."
    />
    <title>Forge — Trading Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
